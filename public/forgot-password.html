<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Mantra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">Mantra<span style="color:var(--accent)">.</span></div>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div id="forgotStep">
        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="resetEmail" required placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg">Send Reset Link</button>
        </form>
      </div>

      <div id="successStep" style="display:none;text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">📬</div>
        <h3 style="margin-bottom:8px;">Check Your Email!</h3>
        <p style="color:var(--text-muted);margin-bottom:24px;">We've sent a password reset link to <b id="sentTo"></b>. Check your inbox and spam folder.</p>
        <a href="login.html" class="btn btn-primary btn-full">Back to Login</a>
      </div>

      <div class="auth-switch" style="margin-top:20px;">
        Remember your password? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      // Firebase stub: sendPasswordResetEmail(auth, email)
      // When Firebase is configured, uncomment and use that instead
      document.getElementById('sentTo').textContent = email;
      document.getElementById('forgotStep').style.display = 'none';
      document.getElementById('successStep').style.display = 'block';
    });
  </script>
</body>
</html>
