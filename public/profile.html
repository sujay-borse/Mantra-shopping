<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Mantra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">`n  <link rel="stylesheet" href="css/dark-theme.css">>
</head>
<body class="pt-navbar bg-bg">
  
  <div class="breadcrumb container">
    <a href="index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">My Account</span>
  </div>

  <div class="profile-page">
    <div class="profile-layout">
      <!-- Sidebar -->
      <aside class="profile-sidebar">
        <div class="profile-avatar" id="pAvatar">A</div>
        <div class="profile-name" id="pName">User Name</div>
        <div class="profile-email" id="pEmail">user@example.com</div>
        
        <div class="profile-nav">
          <div class="profile-nav-link active" onclick="switchTab('orders', this)">
            <i class="fa-solid fa-box"></i> Orders
          </div>
          <div class="profile-nav-link" onclick="switchTab('address', this)">
            <i class="fa-solid fa-location-dot"></i> Saved Addresses
          </div>
          <div class="profile-nav-link" onclick="window.location.href='wishlist.html'">
            <i class="fa-solid fa-heart"></i> Wishlist
          </div>
          <div class="profile-nav-link" style="color:var(--error);" onclick="Store.auth.logout(); window.location.href='index.html'">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </div>
        </div>
      </aside>
      
      <!-- Content -->
      <main>
        <!-- Orders Tab -->
        <div id="tab-orders" class="profile-section">
          <h2 style="font-size:1.25rem; margin-bottom:24px;">Order History</h2>
          <div id="ordersList"></div>
        </div>
        
        <!-- Address Tab -->
        <div id="tab-address" class="profile-section" style="display:none;">
          <h2 style="font-size:1.25rem; margin-bottom:24px;">Saved Addresses</h2>
          <div id="addressList"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    function switchTab(tabId, el) {
      document.querySelectorAll('.profile-nav-link').forEach(link => link.classList.remove('active'));
      el.classList.add('active');
      
      document.getElementById('tab-orders').style.display = 'none';
      document.getElementById('tab-address').style.display = 'none';
      
      document.getElementById(`tab-${tabId}`).style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const user = Store.auth.user();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      // Populate User Info
      document.getElementById('pName').textContent = user.name;
      document.getElementById('pEmail').textContent = user.email;
      document.getElementById('pAvatar').textContent = user.name.charAt(0).toUpperCase();
      
      // Orders
      const orders = Store.orders.list();
      const ordersContainer = document.getElementById('ordersList');
      
      if (orders.length === 0) {
        ordersContainer.innerHTML = '<div class="empty-state"><p>No orders placed yet.</p></div>';
      } else {
        ordersContainer.innerHTML = orders.map(o => {
          let statusClass = 'status-processing';
          if (o.status === 'Delivered') statusClass = 'status-delivered';
          if (o.status === 'Shipped') statusClass = 'status-shipped';
          
          const itemsHTML = o.items.map(item => `
            <div style="display:flex; gap:12px; margin-top:12px; border-top:1px solid var(--border); padding-top:12px;">
              <img src="${item.img}" style="width:50px; height:60px; object-fit:cover; border-radius:4px;">
              <div>
                <div style="font-weight:600; font-size:0.875rem;">${item.name}</div>
                <div style="color:var(--text-muted); font-size:0.8125rem;">Qty: ${item.qty} | Size: ${item.size}</div>
              </div>
            </div>
          `).join('');
          
          return `
            <div class="order-card">
              <div class="order-card-header">
                <div>
                  <div style="font-weight:700; font-size:0.9375rem;">Order #${o.id}</div>
                  <div style="font-size:0.8125rem; color:var(--text-muted);">${new Date(o.date).toLocaleDateString()}</div>
                </div>
                <div style="text-align:right;">
                  <div class="order-status ${statusClass}">${o.status}</div>
                  <div style="font-weight:700; margin-top:4px;">₹${o.total}</div>
                </div>
              </div>
              ${itemsHTML}
            </div>
          `;
        }).join('');
      }
      
      // Address
      const savedAddr = localStorage.getItem('checkoutAddress');
      const addrContainer = document.getElementById('addressList');
      if (!savedAddr) {
        addrContainer.innerHTML = '<div class="empty-state"><p>No saved addresses found.</p></div>';
      } else {
        const addr = JSON.parse(savedAddr);
        addrContainer.innerHTML = `
          <div class="order-card" style="display:flex; gap:16px;">
            <i class="fa-solid fa-location-dot" style="color:var(--primary); font-size:1.25rem;"></i>
            <div>
              <div style="font-weight:700; margin-bottom:4px;">${addr.name}</div>
              <div style="color:var(--text-secondary); font-size:0.9375rem; line-height:1.6;">
                ${addr.line1}<br>
                ${addr.line2 ? addr.line2 + '<br>' : ''}
                ${addr.city}, ${addr.state} - ${addr.pin}<br>
                Phone: ${addr.phone}
              </div>
              <button class="btn btn-outline btn-sm mt-3">Edit Address</button>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
